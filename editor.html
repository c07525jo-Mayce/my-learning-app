<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教材編輯室</title>
<style>
:root{--p:#6c63ff;--bg:#f5f6fb;--t:#293044}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(135deg,#6c63ff,#918cff);color:white;text-align:center;padding:25px}header h1{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}
.note,.panel{background:#fff;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px #00000012}.note{background:#fff8d8}
.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}h2{margin-top:0;font-size:20px}.field{margin:10px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #dce0eb;border-radius:10px;font:inherit}textarea{min-height:180px}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:bold;cursor:pointer;background:#e9e9f3}.primary{background:var(--p);color:#fff}.danger{background:#ffe5e5;color:#b33}
.list{display:grid;gap:7px}.item{display:flex;gap:8px;align-items:center;padding:11px;border:1px solid #e5e5ef;border-radius:10px;cursor:pointer}.item.active{border:2px solid var(--p);background:#f5f4ff}.item span{flex:1}
.preview{background:#fafaff;border-radius:12px;padding:16px;min-height:180px;line-height:1.8}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.small{font-size:13px;color:#778}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>🛠️ 我的教材編輯室</h1><p>自己新增、修改、整理教材內容</p></header>
<div class="wrap">
<div class="note">💡 <b>安全試用版：</b>這個工具不會影響目前已經上線的 GitHub 網站。修改內容會先儲存在目前的瀏覽器，也可以下載成教材資料檔備份。</div>
<div class="grid">
<div class="panel">
<h2>📚 課程資料</h2>
<div class="field"><label>學科</label><select id="subject"><option>國語</option><option>數學</option><option>社會</option><option>自然</option><option>英文</option></select></div>
<div class="field"><label>學制</label><select id="stage"><option>國小</option><option>國中</option><option>高中</option></select></div>
<div class="field"><label>年級</label><input id="grade" value="四年級"></div>
<div class="field"><label>學期</label><select id="semester"><option>上學期</option><option>下學期</option></select></div>
<div class="field"><label>課次</label><input id="lessonNo" value="第一課"></div>
<div class="field"><label>課名</label><input id="lessonTitle" value="水陸小高手"></div>
<hr><h2>🧩 教材區塊</h2><div class="list" id="list"></div>
<button style="width:100%;margin-top:10px" onclick="add()">＋ 新增自訂區塊</button>
</div>
<div class="panel">
<div id="empty" class="small">← 從左邊選擇一個區塊開始編輯</div>
<div id="edit" class="hidden">
<h2 id="heading"></h2>
<div class="field"><label>區塊名稱</label><input id="name"></div>
<div class="field"><label>內容</label><textarea id="content" placeholder="直接貼上教材內容即可..."></textarea></div>
<div class="actions"><button class="primary" onclick="save()">💾 儲存</button><button onclick="preview()">👀 預覽</button><button class="danger" onclick="remove()">🗑️ 刪除</button></div>
<hr><h2>✨ 預覽</h2><div class="preview" id="preview"></div>
</div>
<hr><h2>📦 備份教材</h2>
<div class="actions"><button onclick="saveAll()">💾 儲存到這台裝置</button><button class="primary" onclick="download()">⬇️ 下載教材資料</button><button onclick="document.getElementById('file').click()">📂 載入資料</button></div>
<input class="hidden" id="file" type="file" accept=".json" onchange="loadFile(event)">
<p class="small">下一階段，我們再把這份教材資料直接套用到正式學習 APP。</p>
</div></div></div>
<script>
const names=['📖 課文','📚 課文導讀','🧱 課文結構','💡 課文大意','❓ 閱讀理解','✏️ 生字','🔤 字音字形','⭕ 圈詞','🚂 成語列車','💬 句型與類疊','✨ 修辭分析','🏆 大挑戰'];
let data=JSON.parse(localStorage.getItem('editorData')||'null')||{subject:'國語',stage:'國小',grade:'四年級',semester:'上學期',lessonNo:'第一課',lessonTitle:'水陸小高手',sections:names.map(n=>({name:n,content:''}))};
let cur=-1;
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}
function render(){let l=document.getElementById('list');l.innerHTML='';data.sections.forEach((s,i)=>{let d=document.createElement('div');d.className='item'+(i==cur?' active':'');d.innerHTML='<span>'+esc(s.name)+'</span>';d.onclick=()=>select(i);l.appendChild(d)})}
function select(i){cur=i;let s=data.sections[i];document.getElementById('empty').classList.add('hidden');document.getElementById('edit').classList.remove('hidden');document.getElementById('heading').textContent='編輯：'+s.name;document.getElementById('name').value=s.name;document.getElementById('content').value=s.content;preview();render()}
function save(){if(cur<0)return;data.sections[cur].name=document.getElementById('name').value||'未命名區塊';data.sections[cur].content=document.getElementById('content').value;render();preview();saveAll()}
function add(){let n=prompt('新區塊名稱：');if(n){data.sections.push({name:'📌 '+n,content:''});cur=data.sections.length-1;select(cur)}}
function remove(){if(cur>=0&&confirm('確定刪除？')){data.sections.splice(cur,1);cur=-1;document.getElementById('edit').classList.add('hidden');document.getElementById('empty').classList.remove('hidden');render();saveAll()}}
function preview(){if(cur<0)return;document.getElementById('preview').innerHTML='<h3>'+esc(document.getElementById('name').value)+'</h3>'+esc(document.getElementById('content').value).replace(/\n/g,'<br>')}
function sync(){['subject','stage','grade','semester','lessonNo','lessonTitle'].forEach(k=>data[k]=document.getElementById(k).value)}
function saveAll(){sync();localStorage.setItem('editorData',JSON.stringify(data))}
function download(){saveAll();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=data.grade+'_'+data.lessonNo+'_'+data.lessonTitle+'_教材資料.json';a.click()}
function loadFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);init();alert('已載入教材資料！')}catch(x){alert('檔案格式不正確')}};r.readAsText(f)}
function init(){['subject','stage','grade','semester','lessonNo','lessonTitle'].forEach(k=>document.getElementById(k).value=data[k]||'');cur=-1;render()}
init()
</script></body></html>
